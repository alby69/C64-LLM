services:
  c64-pipeline:
    build: .
    volumes:
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - INPUT_TYPE=${INPUT_TYPE:-asm}
    command: >
      sh -c "INPUT_TYPE_CMD=\"$$INPUT_TYPE\";
             if [ \"$$INPUT_TYPE_CMD\" = \"pdf\" ] || [ \"$$INPUT_TYPE_CMD\" = \"all\" ]; then
               if ls /data/input/*.pdf 1> /dev/null 2>&1; then
                 python pdf2text.py /data/input/$(ls /data/input/ | head -1) /data/output/raw.txt;
                 python text_cleaner.py /data/output/raw.txt /data/output/clean.txt;
               fi;
             fi;
             python build_dataset.py $$INPUT_TYPE_CMD /data /data/output/dataset.jsonl"

  c64-train:
    build: .
    volumes:
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=""
    deploy:
      resources:
        limits:
          memory: 16G
    command: python train_lora.py /data/output/dataset.jsonl