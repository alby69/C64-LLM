services:
  c64-ui:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./agent:/app/agent
      - ./pipeline:/app/pipeline
      - ./utils:/app/utils
      - ./config:/app/config
      - ./prompts:/app/prompts
      - ./knowledge_base:/app/knowledge_base
    environment:
      - PYTHONUNBUFFERED=1
      - GGUF_MODEL_PATH=/app/data/models/qwen2.5-coder-1.5b.Q4_K_M.gguf
    command: python agent/agent_pro.py

  c64-pipeline:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - INPUT_PDF=/app/data/input/${INPUT_PDF:-manuale.pdf}
      - RAW_TEXT=/app/data/output/raw.txt
      - CLEAN_TEXT=/app/data/output/clean.txt
      - DATASET_JSONL=/app/data/output/dataset_unified.jsonl
    command: python run_pipeline.py

  c64-train:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OUTPUT_DIR=/app/data/models/c64-lora-pro
    deploy:
      resources:
        limits:
          memory: 16G
    command: python pipeline/train_lora.py /app/data/output/dataset_unified.jsonl
