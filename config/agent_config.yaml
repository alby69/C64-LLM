agent:
  max_attempts: 3
  model_name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  temperature: 0.3
  top_p: 0.9
  max_new_tokens: 512

rag:
  k_results: 10
  follow_links: true
  use_hyde: false
  chunk_size: 1000
  chunk_overlap: 200
  additional_knowledge_paths:
    - "data/kb"
    - "tutorial/md"

teacher:
  # Backend: opencode | openrouter | groq | ollama | huggingface
  type: "opencode"
  model: ""
  api_key: "${TEACHER_API_KEY}"
  strategy:
    types: ["factual", "code", "explain", "bugfix", "theory"]
    qa_per_chunk: 2
    languages: ["it", "en"]
    max_chunks: 100
  quality:
    min_output_length: 20
    deduplicate_similarity: 0.85
    test_assembly: true
    test_basic: true

ui:
  theme: "soft"
  show_sources: true
  prompt_library:
    - "Come posso cambiare il colore del bordo?"
    - "Esegui un ciclo in BASIC per muovere uno sprite"
    - "Configura un raster interrupt a riga 100"
    - "Pulisci lo schermo in Assembly"
