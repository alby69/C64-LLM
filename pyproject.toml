[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c64-llm"
version = "0.1.0"
description = "C64-LLM — Sistema multi-agente LLM con RAG per lo sviluppo C64 assistito da AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.37.0",
    "accelerate>=0.27.0",
    "sentencepiece>=0.1.99",
    "bitsandbytes>=0.41.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.scripts]
c64-llm = "run_pipeline:main"

[tool.setuptools]
packages = ["agent", "pipeline", "utils", "tools", "plugins"]